<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Cyber-Hub | Quiz Questions</title>
    
</head>
<body>
<style>
/* =========================
   QUESTIONS PAGE
========================= */
 body{
    background-color: #3f3c3c;
    color: #ffffff;;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo img {
    width: 80px;
    height: 80px;
    object-fit: contain;
}
p{
font-size: 35px;
color: #f5d34e;

}
.question-hero {
    margin-bottom: 10px;
    width: 80%;
    max-width: 1000px;
    margin: 60px auto 40px;
    text-align: center;
}

.question-hero h1 {
    color: #ffffff;
    font-size:30px;
    margin: 5px 0 8px;
}

.question-hero p:last-child {
    color: #d6d6d6;
    font-size: 20px;
}


/* QUESTIONS CONTAINER */

.questions-container {
    width: 90%;
    max-width: 850px;
    margin: 40px auto 80px;
}


/* TOP INFORMATION */

.quiz-top {
    display: flex;
    justify-content: space-between;
    color: white;
    margin-bottom: 15px;
    font-weight: bold;
}


/* PROGRESS BAR */

.progress-container {
    width: 100%;
    height: 10px;
    background-color: #555;
    border-radius: 10px;
    margin-bottom: 30px;
    overflow: hidden;
}

#progress-bar {
    width: 0%;
    height: 100%;
    background-color: #f5d34e;
    transition: width 0.4s ease;
}


/* QUESTION CARD */

.question-card {
    background-color: white;
    color: #222;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.question-card h2 {
    margin-bottom: 30px;
    line-height: 1.5;
    font-size: 23px;
}


/* ANSWER OPTIONS */
.answer-option {
    width: 100%;
    padding: 15px;
    margin-bottom: 12px;
    background-color: #f5f5f5;
    border: 2px solid transparent;
    border-radius: 9px;
    text-align: left;
    cursor: pointer;
    font-size: 15px;
    transition: 0.3s;
}

.answer-option:hover {
    border-color: #f5d34e;
    background-color: #fff9d9;
}

.answer-option.correct {
    background-color: #d9f7df;
    border-color: #28a745;
}

.answer-option.wrong {
    background-color: #ffdede;
    border-color: #dc3545;
}

.answer-option.disabled {
    cursor: not-allowed;
}


/* EXPLANATION */
#explanation {
    margin-top: 20px;
}

.explanation {
    padding: 15px;
    background-color: #fff9d9;
    border-left: 5px solid #f5d34e;
    border-radius: 8px;
    line-height: 1.5;
}


/* NEXT BUTTON */
#next-button {
    display: none;
    margin-top: 20px;
    padding: 12px 22px;
    background-color: #222;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

#next-button:hover {
    background-color: #f5d34e;
    color: #222;
}

.score-cards {
    display: grid;
    grid-template-columns: repeat(3, 180px);
    justify-content: center;
    gap: 20px;
    margin: 30px auto;
}

.score-card {
    background-color: white;
    color: #222;
    padding: 20px 15px;
    border-radius: 12px;
    min-height: 130px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
}
.score-card p {
    color: #555;
    font-size: 14px;
    margin: 0;
    text-align: center;
}
.result-area {
    display: none;
    width: 85%;
    max-width: 900px;
    margin: 60px auto;
    text-align: center;
}
.result-area h2 {
    color: white;
    margin-bottom: 20px;
}

.result-score {
    color: #f5d34e;
    font-size: 42px;
    font-weight: bold;
    margin: 20px 0;
}

.result-score small {
    color: white;
    font-size: 20px;
}

#result-message {
    color: white;
    margin: 15px 0 25px;
}
.result-area > button {
    padding: 11px 25px;
    background-color: #f5d34e;
    color: #222;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

.result-area > button:hover {
    background-color: white;
}
</style>

<header>
    <div class="logo">
        <img src="images/logo1.png"
             alt="Cyber-Hub Logo">
    </div>
</header>

<main>

    <!-- QUIZ QUESTION HEADER -->
    <section class="question-hero">
        <p class="section-label">
            CYBERSECURITY QUIZ
        </p>
        <h1>Test Your Knowledge</h1>
        <p id="quiz-info">
            Answer the following questions carefully.
        </p>
    </section>


    <!-- QUESTION AREA -->
    <section class="questions-container">

        <div class="quiz-top">
            <span id="question-number">
                Question 1 of 5 </span>
            <span id="score">Score: 0</span>
        </div>


        <!-- PROGRESS BAR -->
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>


        <!-- QUESTION CARD -->
        <div class="question-card">

            <h2 id="question">
                Question will appear here
            </h2>


            <div id="options">
                <!-- Options will be added using JavaScript -->
            </div>

            <div id="explanation"></div>

            <button id="next-button"
                    onclick="nextQuestion()">
                    Next Question →
            </button>
        </div>
    </section>


    <!-- RESULT -->
    <section id="result-area" class="result-area">

        <p class="section-label">QUIZ COMPLETED</p>
        <h2>Your Results</h2>


        <div class="result-score">
            <span id="final-score">0</span>
            <small>/ 5</small>
        </div>


        <h3 id="result-message"></h3>


        <div class="score-cards">

            <div class="score-card">
                <div class="score-icon">✅</div>
                <h3 id="correct-count">0</h3>
                <p>Correct</p>
            </div>


            <div class="score-card">
                <div class="score-icon">❌</div>
                <h3 id="wrong-count">0</h3>
                <p>Wrong</p>
            </div>


            <div class="score-card">
                <div class="score-icon">📊</div>
                <h3 id="percentage">0%</h3>
                <p>Percentage</p>
            </div>

        </div>


        <button onclick="restartQuiz()">
            Try Again 🔄
        </button>

    </section>
</main>
<script src="quiz.js"></script>

</body>
</html>
